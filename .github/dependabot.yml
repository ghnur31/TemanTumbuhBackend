# Dependabot membuka PR otomatis untuk update dependency.
# Catatan: file ini baru aktif setelah sampai di branch default (main), dan
# "Dependabot security updates" perlu dinyalakan di
# Settings → Code security oleh admin repo.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # PR diarahkan ke dev, mengikuti alur dev → staging → main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Update minor/patch digabung jadi satu PR per minggu supaya tidak
    # membanjiri repo. Update major tetap datang terpisah karena bisa
    # membawa breaking change dan perlu dicek satu per satu.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Ikut memperbarui versi action yang dipakai di workflow CI.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    commit-message:
      prefix: chore(ci)
